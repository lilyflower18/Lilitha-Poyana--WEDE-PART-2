<main>
    <section class="enquiry-section">
        <h2>Send Us an Enquiry</h2>
        <p>Please fill out the form below and we will get back to you as soon as possible.</p>

        <form action="#" method="post" class="enquiry-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="+27 123 456 7890" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Subject of your enquiry" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

            <button type="submit">Submit Enquiry</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; Ekhaya Skills Initiative|All Rights Reserved</p>
</footer>

</body>
</html>
